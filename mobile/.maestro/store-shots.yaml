# Captures the raw App Store screenshots on an iOS Simulator build (run by .eas/workflows/store-shots.yml).
# Maestro keeps takeScreenshot output in a temp folder EAS does not upload, so screens are captured another way:
# the "zz-*" optional taps never match, which makes Maestro keep a debug capture of that screen.
appId: com.samayvashsht.chezz
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "zz-onboard-1"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "zz-onboard-3"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: "zz-what-you-get"
    optional: true
- tapOn:
    text: "Continue with the free version"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "zz-sign-in"
    optional: true
- tapOn:
    text: "Continue as guest"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "zz-home"
    optional: true
- tapOn:
    text: "Play a bot"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "zz-pick-level"
    optional: true
- tapOn:
    text: "Start ranked game"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
# 1.e4, 2.Nf3, 3.d4 so the board looks like a real game
- tapOn:
    point: "56%,51%"
- tapOn:
    point: "56%,40%"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    point: "80%,56%"
- tapOn:
    point: "68%,45%"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    point: "44%,51%"
- tapOn:
    point: "44%,40%"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "zz-board"
    optional: true
- tapOn:
    text: "Back to Home"
    optional: true
- tapOn:
    text: "Online"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "zz-online"
    optional: true
- tapOn:
    text: "Puzzles"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "zz-puzzles"
    optional: true
- tapOn:
    text: "Rankings"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "zz-rankings"
    optional: true
- tapOn:
    text: "City vs City"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "zz-cities"
    optional: true
- tapOn:
    text: "Profile"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "zz-profile"
    optional: true
- tapOn:
    text: ".*Chesz Pro.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "zz-paywall"
    optional: true
